services:
  - type: web
    name: vjaipur-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false

  - type: static
    name: vjaipur-client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Same-origin API proxy — some iOS content blockers / DNS filters block
      # *.workers.dev wholesale (the SITE loads fine from onrender.com, but
      # every direct API fetch dies at the network layer with a TypeError —
      # Sureka's phone, 2026-07-27). Proxying /api/* first-party makes the
      # API invisible to those blocklists; src/net/http.ts falls back to this
      # path automatically when a direct worker fetch throws.
      # MUST stay ABOVE the SPA catch-all — routes evaluate in order.
      - type: rewrite
        source: /api/*
        destination: https://vjaipur-worker.theonenonlyvj.workers.dev/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html must NEVER be cached — it references the content-hashed JS/CSS
      # bundle, so a stale HTML pins a stale app (this caused repeated "expired
      # token / Failed to create room / stats not saving" reports on mobile
      # Safari, which caches aggressively). Always revalidate the HTML so every
      # load picks up the latest deployed bundle.
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      # Hashed build assets are immutable (their name changes when content does),
      # so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SERVER_URL
        sync: false
