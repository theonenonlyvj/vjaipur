services:
  - type: web
    name: vjaipur-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false

  - type: static
    name: vjaipur-client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html must NEVER be cached — it references the content-hashed JS/CSS
      # bundle, so a stale HTML pins a stale app (this caused repeated "expired
      # token / Failed to create room / stats not saving" reports on mobile
      # Safari, which caches aggressively). Always revalidate the HTML so every
      # load picks up the latest deployed bundle.
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      # Hashed build assets are immutable (their name changes when content does),
      # so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SERVER_URL
        sync: false
